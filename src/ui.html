<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ConversionCo — Mission Control</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#071B33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MissionCtrl">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap');
  :root {
    --navy: #0B1D33; --navy2: #123153; --ink: #0C1424;
    --bg: #EDF0F4; --card: #ffffff;
    --line: #E3E8EF; --line2: #D3DBE5; --text: #101828; --muted: #5D6B7E; --faint: #8B98A9;
    --gold: #C7A86B; --gold2: #A98D52;
    --green: #067647; --greenbg: #ECFDF3; --amber: #B54708; --amberbg: #FFFAEB;
    --blue: #175CD3; --purple: #6941C6; --red: #B42318; --redbg: #FEF3F2;
    --shadow-1: 0 1px 2px rgba(16,24,40,.05);
    --shadow-2: 0 1px 2px rgba(16,24,40,.05), 0 8px 24px -6px rgba(16,24,40,.09);
    --shadow-3: 0 4px 8px -2px rgba(16,24,40,.08), 0 24px 48px -12px rgba(16,24,40,.20);
    --r-card: 14px; --r-ctl: 9px;
    --font-ui: 'IBM Plex Sans', -apple-system, 'Segoe UI', Roboto, sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
    --font-disp: 'Sora', 'IBM Plex Sans', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html { scroll-behavior: smooth; }
  body { font-family: var(--font-ui); color: var(--text); -webkit-font-smoothing: antialiased;
    background: var(--bg);
    background-image: radial-gradient(1100px 420px at 50% -240px, rgba(11,29,51,.10), transparent 60%),
      radial-gradient(rgba(16,24,40,.045) 1px, transparent 1px);
    background-size: auto, 26px 26px; background-attachment: fixed; }

  /* ═ Command header ═ */
  header { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 16px;
    padding: 13px 26px; color: #fff; border-bottom: 2px solid var(--gold);
    background: linear-gradient(135deg, #060F1E 0%, #0B1D33 55%, #123153 100%); }
  header::before { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 1px, transparent 1px 90px); }
  header h1 { font-family: var(--font-disp); font-size: 16px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
  header .tag { font-family: var(--font-mono); font-size: 10px; letter-spacing: .24em; text-transform: uppercase;
    color: var(--gold); border: 1px solid rgba(199,168,107,.75); border-radius: 4px; padding: 4px 10px; background: rgba(199,168,107,.07); }
  header .spacer { flex: 1; }
  header button { background: rgba(255,255,255,.05); color: #DCE4EE; border: 1px solid rgba(255,255,255,.18);
    padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 12.5px; font-weight: 600; letter-spacing: .02em; transition: all .16s; }
  header button:hover { background: rgba(199,168,107,.16); border-color: var(--gold); color: #fff; transform: translateY(-1px); }

  /* ═ Ops status strip ═ */
  #mcStrip { position: sticky; top: 57px; z-index: 19; display: flex; align-items: center; gap: 24px;
    background: linear-gradient(180deg, #0A1526, #0B1826); color: #7E8CA0; border-bottom: 1px solid #16263D;
    padding: 7px 26px; font-family: var(--font-mono); font-size: 11px; letter-spacing: .07em; }
  #mcStrip .lbl { color: #46566B; text-transform: uppercase; font-size: 9px; letter-spacing: .2em; margin-right: 7px; }
  #mcStrip b { color: #E7EDF5; font-weight: 600; }
  #mcStrip .ok { color: #35D07F; } #mcStrip .warn { color: #FFC53D; }
  #mcStrip .dot { display: inline-block; width: 7px; height: 7px; border-radius: 99px; background: #35D07F;
    margin-right: 7px; box-shadow: 0 0 8px #35D07F; animation: mcPulse 2.2s infinite; vertical-align: 1px; }
  #mcStrip .dot.warn { background: #FFC53D; box-shadow: 0 0 8px #FFC53D; }
  #mcStrip .spacer { flex: 1; }
  @keyframes mcPulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }

  main { max-width: 1240px; margin: 0 auto; padding: 28px 28px 60px; animation: pageIn .35s ease both; }
  @keyframes pageIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* ═ Command bar (new client) ═ */
  .addbar { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-card);
    padding: 16px 18px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 20px; box-shadow: var(--shadow-2); }
  .addbar b { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin-right: 2px; font-weight: 700; }
  .addbar input { padding: 10px 13px; border: 1.5px solid var(--line); border-radius: var(--r-ctl); font-size: 13.5px;
    background: #FBFCFE; transition: border-color .15s, box-shadow .15s, background .15s; }
  .addbar input:focus { outline: none; border-color: var(--navy); background: #fff; box-shadow: 0 0 0 3px rgba(11,29,51,.10); }
  #newEmail { min-width: 250px; }

  /* ═ Buttons ═ */
  .btn { padding: 10px 16px; border: 0; border-radius: var(--r-ctl); font-size: 13px; font-weight: 600;
    cursor: pointer; font-family: inherit; letter-spacing: .01em; transition: all .16s; }
  .btn:focus-visible, .addbar input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .btn-primary { color: #fff; background: linear-gradient(180deg, #13314F, #0B1D33); box-shadow: inset 0 1px 0 rgba(255,255,255,.14), var(--shadow-1); }
  .btn-primary:hover { background: linear-gradient(180deg, #1A3E63, #0F2745); transform: translateY(-1px); box-shadow: inset 0 1px 0 rgba(255,255,255,.14), 0 6px 16px -4px rgba(11,29,51,.4); }
  .btn-ghost { background: #fff; color: var(--navy); border: 1px solid var(--line2); }
  .btn-ghost:hover { border-color: #A9B6C6; background: #F8FAFC; transform: translateY(-1px); }
  .btn-green { color: #fff; background: linear-gradient(180deg, #0A8754, #067647); box-shadow: inset 0 1px 0 rgba(255,255,255,.16), var(--shadow-1); }
  .btn-green:hover { transform: translateY(-1px); box-shadow: inset 0 1px 0 rgba(255,255,255,.16), 0 6px 16px -4px rgba(6,118,71,.45); }
  .btn-red { background: var(--redbg); color: var(--red); border: 1px solid #FECDCA; }
  .btn-red:hover { background: #FEE4E2; }
  .btn:disabled { opacity: .5; cursor: wait; transform: none !important; }

  .cols { display: grid; grid-template-columns: 1fr 350px; gap: 22px; align-items: start; }
  @media (max-width: 900px) { .cols { grid-template-columns: 1fr; } }

  /* ═ Roster table ═ */
  table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line);
    border-radius: var(--r-card); overflow: hidden; box-shadow: var(--shadow-2); }
  th { text-align: left; font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: .18em;
    color: var(--faint); padding: 13px 16px; border-bottom: 1px solid var(--line); background: #FBFCFE; }
  td { padding: 14px 16px; border-bottom: 1px solid #EDF1F6; font-size: 13.5px; vertical-align: middle; font-variant-numeric: tabular-nums; }
  tr:last-child td { border-bottom: 0; }
  tr.rowclick { cursor: pointer; transition: background .12s, box-shadow .12s; }
  tr.rowclick:hover { background: #F7F9FC; box-shadow: inset 3px 0 0 var(--gold); }
  .chip { display: inline-block; padding: 4px 11px; border-radius: 6px; font-size: 10.5px; font-weight: 700;
    white-space: nowrap; text-transform: uppercase; letter-spacing: .08em; }

  /* ═ Panels + activity console ═ */
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-card); padding: 18px; box-shadow: var(--shadow-2); }
  .panel h3 { font-family: var(--font-mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: .2em;
    color: var(--faint); margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
  .feed { display: flex; flex-direction: column; gap: 0; max-height: 500px; overflow-y: auto; }
  .feed .item { font-size: 12.5px; line-height: 1.5; padding: 9px 0 9px 16px; border-left: 2px solid var(--line);
    position: relative; margin-left: 4px; }
  .feed .item::before { content: ""; position: absolute; left: -5px; top: 14px; width: 8px; height: 8px;
    border-radius: 99px; background: #C6D0DC; border: 2px solid #fff; box-shadow: 0 0 0 1px var(--line); }
  .feed .item:last-child { border-left-color: transparent; }
  .feed time { color: var(--faint); font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .04em; display: block; margin-bottom: 1px; }

  .themesw { background: #fff; border: 1px solid var(--line2); border-radius: 10px; padding: 8px 10px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; transition: all .16s; font-family: inherit; }
  .themesw:hover { border-color: #A9B6C6; transform: translateY(-1px); box-shadow: var(--shadow-2); }
  .themesw:disabled { opacity: .5; cursor: wait; }
  .themesw.sel { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(199,168,107,.25); }

  /* ═ Drawer: the client dossier ═ */
  #overlay { position: fixed; inset: 0; background: rgba(6,15,30,.55); backdrop-filter: blur(3px); display: none; z-index: 30; }
  #drawer { position: fixed; top: 0; right: -580px; width: min(580px, 100vw); height: 100vh; background: #FCFDFE;
    z-index: 31; transition: right .28s cubic-bezier(.3,.8,.3,1); overflow-y: auto; box-shadow: var(--shadow-3); }
  #drawer.open { right: 0; } #overlay.open { display: block; }
  #drawer .dhead { position: relative; color: #fff; padding: 22px 26px 20px; border-bottom: 2px solid var(--gold);
    background: linear-gradient(135deg, #060F1E, #0B1D33 60%, #123153); }
  #drawer .dhead::before { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(90deg, rgba(255,255,255,.045) 0 1px, transparent 1px 70px); }
  #drawer .dhead h2 { font-family: var(--font-disp); font-size: 19px; font-weight: 700; letter-spacing: .01em; }
  #drawer .dhead p { opacity: .7; font-size: 12.5px; margin-top: 4px; font-family: var(--font-mono); letter-spacing: .02em; }
  #drawer .dbody { padding: 22px 26px 40px; display: flex; flex-direction: column; gap: 18px; }
  .kv { font-size: 13.5px; } .kv b { display: block; color: var(--faint); font-family: var(--font-mono); font-size: 9.5px;
    text-transform: uppercase; letter-spacing: .18em; margin-bottom: 3px; }
  .intake { background: #F7F9FC; border: 1px solid var(--line); border-radius: 12px; padding: 15px; }
  .intake h4 { font-size: 12px; margin-bottom: 8px; color: var(--navy); text-transform: uppercase; letter-spacing: .08em; }
  .intake dl { font-size: 13px; } .intake dt { font-weight: 600; margin-top: 9px; color: #344054; }
  .intake dd { margin-left: 0; color: #475467; white-space: pre-wrap; }
  textarea, select, .modal input { width: 100%; padding: 10px 13px; border: 1.5px solid var(--line); border-radius: var(--r-ctl);
    font-size: 13.5px; font-family: inherit; background: #FBFCFE; transition: border-color .15s, box-shadow .15s; }
  textarea:focus, select:focus, .modal input:focus { outline: none; border-color: var(--navy); background: #fff; box-shadow: 0 0 0 3px rgba(11,29,51,.10); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }

  /* ═ Modal ═ */
  .modal { position: fixed; inset: 0; background: rgba(6,15,30,.55); backdrop-filter: blur(3px); display: none; place-items: center; z-index: 40; }
  .modal.open { display: grid; }
  .modal .box { background: #fff; border-radius: 16px; border: 1px solid var(--line); width: min(640px, 94vw);
    max-height: 90vh; overflow-y: auto; padding: 28px; box-shadow: var(--shadow-3); animation: pageIn .25s ease both; }
  .modal h2 { font-family: var(--font-disp); font-size: 18px; margin-bottom: 4px; color: var(--navy); }
  .modal p.hint { font-size: 12.5px; color: var(--muted); margin-bottom: 14px; }
  .modal label { display: block; font-size: 12px; font-weight: 600; margin: 14px 0 5px; color: #344054; }
  .modal .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .modal .foot { display: flex; gap: 10px; margin-top: 22px; justify-content: flex-end; }
  .okmsg { font-size: 13px; padding: 10px 12px; border-radius: 8px; margin-top: 12px; display: none; }
  .okmsg.ok { background: var(--greenbg); color: var(--green); display: block; }
  .okmsg.bad { background: var(--redbg); color: var(--red); display: block; }

  #toast { position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%); background: rgba(10,21,38,.96);
    color: #fff; padding: 13px 24px; border-radius: 10px; font-size: 13.5px; display: none; z-index: 50;
    border: 1px solid rgba(199,168,107,.55); box-shadow: var(--shadow-3); backdrop-filter: blur(6px); }
  .empty { text-align: center; color: var(--faint); padding: 44px; font-size: 13.5px; }

  /* ═ Instrument tiles ═ */
  #moneyStrip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 16px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-card); padding: 16px 20px 14px;
    box-shadow: var(--shadow-2); position: relative; overflow: hidden; }
  .stat::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--navy); }
  .stat::after { content: ""; position: absolute; top: 0; left: 0; width: 46px; height: 3px; background: var(--gold); }
  .stat b { display: block; font-family: var(--font-mono); font-size: 9.5px; text-transform: uppercase; letter-spacing: .2em; color: var(--faint); margin-bottom: 6px; font-weight: 600; }
  .stat .v { font-family: var(--font-mono); font-size: 26px; font-weight: 600; color: var(--navy); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .stat .sub { font-size: 11.5px; color: var(--faint); margin-top: 3px; }
  #moneyStrip .stat:first-child { background: linear-gradient(135deg, #060F1E, #0B1D33 60%, #123153); border-color: #123153; }
  #moneyStrip .stat:first-child b { color: #7E8CA0; }
  #moneyStrip .stat:first-child .v { color: var(--gold); text-shadow: 0 0 24px rgba(199,168,107,.35); }
  #moneyStrip .stat:first-child .sub { color: #7E8CA0; }

  /* ═ Action required ═ */
  #needsStrip { background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--amber);
    border-radius: var(--r-card); padding: 15px 18px; margin-bottom: 20px; box-shadow: var(--shadow-2); }
  #needsStrip h3 { font-family: var(--font-mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: .2em; color: var(--amber); margin-bottom: 8px; }
  #needsStrip h3::before { content: "▲ "; font-size: 9px; vertical-align: 1px; }
  #needsStrip .need { font-size: 13.5px; padding: 8px 6px; border-bottom: 1px solid #F2F4F7; cursor: pointer; border-radius: 6px; transition: background .12s; }
  #needsStrip .need:last-child { border-bottom: 0; }
  #needsStrip .need:hover { background: var(--amberbg); }
  #needsStrip.allgood { border-left-color: var(--green); }
  #needsStrip.allgood h3 { color: var(--green); } #needsStrip.allgood h3::before { content: "● "; }

  /* health dots */
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 99px; margin-right: 7px; vertical-align: 1px; }
  .dot.green { background: #12B76A; box-shadow: 0 0 0 3px rgba(18,183,106,.15); }
  .dot.yellow { background: #F79009; box-shadow: 0 0 0 3px rgba(247,144,9,.15); }
  .dot.red { background: #F04438; box-shadow: 0 0 0 3px rgba(240,68,56,.18); }
  .dot.gray { background: #CBD5E1; }

  /* ═ View toggle + launch board ═ */
  .viewbar { display: flex; gap: 0; margin-bottom: 14px; align-items: center; background: #E3E8EF;
    border: 1px solid var(--line2); border-radius: 10px; padding: 3px; width: max-content; }
  .viewbar button { border: 0; background: transparent; color: var(--muted); padding: 7px 16px; border-radius: 8px;
    font-size: 11px; font-weight: 700; cursor: pointer; text-transform: uppercase; letter-spacing: .1em; font-family: inherit; transition: all .15s; }
  .viewbar button.on { background: var(--navy); color: #fff; box-shadow: var(--shadow-1); }
  #boardWrap { display: none; overflow-x: auto; padding-bottom: 12px; -webkit-overflow-scrolling: touch; }
  .board { display: flex; gap: 14px; align-items: flex-start; min-width: max-content; }
  .bcol { background: rgba(255,255,255,.6); border: 1px solid var(--line); border-radius: var(--r-card);
    padding: 10px; width: 236px; flex: 0 0 236px; backdrop-filter: blur(2px); }
  .bcol h4 { font-family: var(--font-mono); font-size: 9.5px; text-transform: uppercase; letter-spacing: .16em;
    color: #46566B; padding: 5px 6px 10px; display: flex; justify-content: space-between; border-bottom: 2px solid var(--line2); margin-bottom: 9px; }
  .bcol h4 span { background: var(--navy); color: #fff; border-radius: 5px; padding: 1px 8px; font-size: 10px; }
  .bcard { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 11px 13px; margin-bottom: 9px; cursor: pointer; box-shadow: var(--shadow-1); transition: all .16s; }
  .bcard:hover { border-color: #A9B6C6; box-shadow: var(--shadow-2); transform: translateY(-2px); }
  .peek { position: absolute; top: 7px; right: 7px; background: #fff; border: 1px solid var(--line); border-radius: 7px;
    padding: 2px 8px; font-size: 13px; cursor: pointer; opacity: 0; transition: opacity .15s; }
  .bcard:hover .peek { opacity: .85; } .peek:hover { opacity: 1 !important; background: #F2F4F7; }
  .accessbox { background: #F7F9FC; border: 1px solid var(--line); border-radius: 12px; padding: 15px; }
  .accessbox .alinks { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 11px; font-size: 12.5px; }
  .accessbox .alinks a { color: #475467; text-decoration: none; border-bottom: 1px dotted #C6D0DC; }
  .accessbox .alinks a:hover { color: var(--navy); border-bottom-color: var(--gold); }
  .bcard b { font-size: 13.5px; display: block; }
  .bcard .em { font-size: 11px; color: var(--faint); word-break: break-all; font-family: var(--font-mono); }
  .bcard .tier { font-size: 10px; font-weight: 700; color: var(--purple); text-transform: uppercase; letter-spacing: .08em; }

  /* build progress */
  .bprog { margin-top: 7px; max-width: 280px; }
  .bprog .track { height: 7px; background: #E3E8EF; border-radius: 99px; overflow: hidden; }
  .bprog .fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--gold2), var(--gold), #E4CD9A, var(--gold));
    background-size: 200% 100%; animation: bshine 2.2s linear infinite; transition: width .8s ease; }
  @keyframes bshine { 0% { background-position: 0% 0; } 100% { background-position: 200% 0; } }
  .bprog .blabel { font-family: var(--font-mono); font-size: 10px; color: var(--faint); margin-top: 4px; display: flex; justify-content: space-between; gap: 8px; }

  ::-webkit-scrollbar { width: 9px; height: 9px; } ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #C6D0DC; border-radius: 99px; border: 2px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-thumb:hover { background: #98A6B8; border: 2px solid transparent; background-clip: content-box; }
  ::selection { background: rgba(199,168,107,.3); }

  /* mobile polish */
  @media (max-width: 700px) {
    main { padding: 12px 12px 40px; }
    header { padding: 12px 14px; gap: 8px; }
    header button { padding: 10px 12px; }
    #mcStrip { gap: 12px; padding: 6px 14px; overflow-x: auto; }
    .addbar { padding: 12px; } #newEmail { min-width: 0; flex: 1 1 100%; } .addbar input { flex: 1 1 100%; } .addbar .btn { flex: 1 1 100%; padding: 13px; }
    #moneyStrip { grid-template-columns: 1fr 1fr; gap: 8px; } #moneyStrip .stat:first-child { grid-column: 1 / -1; }
    .stat .v { font-size: 20px; }
    th:nth-child(3), td:nth-child(3) { display: none; }
    td { padding: 12px 10px; } .btn { padding: 12px 14px; }
    .bcol { width: 205px; flex-basis: 205px; }
    #drawer { width: 100vw; right: -100vw; }
  }
</style>
</head>
<body>
<header>
  <h1>ConversionCo</h1><span class="tag">Mission Control</span>
  <span class="spacer"></span>
  <button onclick="pollNow(this)">↻ Check for submissions</button>
  <button onclick="location.href='/activity'" title="Every site edit and publish, across all clients, newest first.">📜 Site activity</button>
  <button onclick="openSettings()">⚙ Settings</button>
</header>

<main>
  <div class="addbar">
    <b>New client:</b>
    <input id="newEmail" type="email" placeholder="client email address">
    <input id="newName" type="text" placeholder="name (optional)">
    <button class="btn btn-primary" id="addBtn" onclick="addClient()">Send Intake 1 →</button>
    <span style="border-left:1px solid var(--line);align-self:stretch;margin:0 4px;"></span>
    <b>💡 Prospect demo:</b>
    <input id="proBiz" type="text" placeholder="business name">
    <input id="proCity" type="text" placeholder="city, state" style="max-width:150px">
    <button class="btn btn-ghost" id="proBtn" onclick="addProspect()" title="Builds them a real demo homepage before you've ever talked — send the link as your pitch.">Build demo →</button>
    <span style="border-left:1px solid var(--line);align-self:stretch;margin:0 4px;"></span>
    <b>📣 Ads-only client:</b>

<div id="toast"></div>

<script>
const STAGES = {
  prospect:       { label: '💡 Prospect — demo',  bg:'#fdf4ff', fg:'#a21caf' },
  new:            { label: 'New',                 bg:'#e2e8f0', fg:'#334155' },
  intake1_sent:   { label: 'Intake 1 sent',       bg:'#dbeafe', fg:'#1d4ed8' },
  intake1_done:   { label: '✓ Intake 1 done — call them!', bg:'#fef3c7', fg:'#b45309' },
  intake2_sent:   { label: 'Intake 2 sent',       bg:'#ede9fe', fg:'#6d28d9' },
  intake2_done:   { label: '✓ Intake 2 done',     bg:'#ccfbf1', fg:'#0f766e' },
  generating:     { label: '⚙ Building site…',    bg:'#fce7f3', fg:'#be185d' },
  preview_ready:  { label: '★ Preview ready',     bg:'#dcfce7', fg:'#15803d' },
  ads_setup:      { label: '📣 Ads — setting up',  bg:'#FFF4E5', fg:'#B54708' },
  ads_live:       { label: '📣 Ads — running',     bg:'#0B1D33', fg:'#C7A86B' },
  live:           { label: '● Live',              bg:'#071B33', fg:'#ffffff' },
  archived:       { label: 'Archived',            bg:'#f1f5f9', fg:'#94a3b8' },
};
let STATE = { clients: [], events: [], settings: {} };

function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.style.display='block'; setTimeout(()=>t.style.display='none', 3500); }
function ago(iso){ if(!iso) return ''; const d = new Date(iso + (iso.includes('Z')||iso.includes('+') ? '' : 'Z')); const m = (Date.now()-d)/60000;
  if (m < 1) return 'just now'; if (m < 60) return Math.floor(m)+'m ago'; if (m < 1440) return Math.floor(m/60)+'h ago'; return Math.floor(m/1440)+'d ago'; }

async function api(path, opts={}) {
  const r = await fetch(path, { headers: {'Content-Type':'application/json'}, ...opts });
  if (r.status === 401) { location.reload(); return {}; }
  return r.json();
}

async function refresh() {
  STATE = await api('/api/state');
  renderOverview(); renderClients(); renderBoard(); renderFeed();
}

let VIEW = localStorage.getItem('cc_view') || 'table';
function setView(v) {
  VIEW = v; localStorage.setItem('cc_view', v);
  document.getElementById('tableWrap').style.display = v === 'table' ? '' : 'none';
  document.getElementById('boardWrap').style.display = v === 'board' ? 'block' : 'none';
  const aw = document.getElementById('adsWrap');
  if (aw) aw.style.display = v === 'ads' ? 'block' : 'none';
  document.getElementById('vTable').classList.toggle('on', v === 'table');
  document.getElementById('vBoard').classList.toggle('on', v === 'board');
  const va = document.getElementById('vAds');
  if (va) va.classList.toggle('on', v === 'ads');
  if (v === 'ads') { try { renderAdsView(); } catch (e) {} }
}

function dot(c) {
  const h = (STATE.overview && STATE.overview.health && STATE.overview.health[c.id]) || { dot: 'gray', why: '' };
  return `<span class="dot ${h.dot}" title="${esc(h.why)}"></span>`;
}

// Build progress bar: real milestones from the builder, blended with elapsed time.
// A typical build runs ~15 minutes; the time-based floor never exceeds 92% so the
// bar only hits 100% when the site actually publishes (stage flips to preview).
const BUILD_MINUTES = 15;
function buildBar(c) {
  if (c.stage !== 'generating') return '';
  const p = (STATE.overview && STATE.overview.buildProgress && STATE.overview.buildProgress[c.id]) || {};
  const started = Date.parse((p.started_at || c.updated_at || '') + (String(p.started_at || c.updated_at || '').includes('Z') ? '' : 'Z'));
  const elapsedMin = isNaN(started) ? 0 : Math.max(0, (Date.now() - started) / 60000);
  const timePct = Math.min(92, (elapsedMin / BUILD_MINUTES) * 100);
  const pct = Math.round(Math.min(97, Math.max(p.pct || 5, timePct)));
  const left = Math.ceil(BUILD_MINUTES - elapsedMin);
  const eta = elapsedMin >= BUILD_MINUTES ? 'finishing up…' : `~${Math.max(1, left)} min left`;
  // HONESTY GUARD: a dead build must never look like it's "finishing up".
  const lastBeat = Date.parse((p.updated_at || p.started_at || '') + (String(p.updated_at || p.started_at || '').includes('Z') ? '' : 'Z'));
  const quietMin = isNaN(lastBeat) ? null : Math.round((Date.now() - lastBeat) / 60000);
  if (quietMin !== null && quietMin >= 20) {
    return `<div class="bprog"><div class="track"><div class="fill" style="width:${pct}%;background:#F59E0B;"></div></div>
      <div class="blabel"><span style="color:#B45309;font-weight:600;">⚠️ Builder went quiet ${quietMin} min ago</span><span>auto-requeue + re-fire is coming</span></div></div>`;
  }
  return `<div class="bprog"><div class="track"><div class="fill" style="width:${pct}%"></div></div>
    <div class="blabel"><span>⚙ ${esc(p.step || 'Building')}</span><span>${pct}% · ${eta}</span></div></div>`;
}
// keep bars moving between refreshes
setInterval(() => {
  if ((STATE.clients || []).some(c => c.stage === 'generating')) { renderClients(); renderBoard(); }
}, 15000);

function renderOverview() {
  const ov = STATE.overview;
  const ms = document.getElementById('moneyStrip'), ns = document.getElementById('needsStrip');
  if (!ov) { ms.innerHTML = ''; ns.style.display = 'none'; return; }
  const m = ov.money;
  ms.innerHTML = `
    <div class="stat"><b>Cash collected</b><div class="v">$${(m.collected).toLocaleString()}</div><div class="sub">project fees paid</div></div>
    <div class="stat"><b>Outstanding</b><div class="v">$${(m.outstanding).toLocaleString()}</div><div class="sub">invoices awaiting payment</div></div>
    <div class="stat"><b>Recurring — MRR</b><div class="v">$${m.mrr.toLocaleString()}/mo</div><div class="sub">${m.hostingCount} hosting subscription${m.hostingCount === 1 ? '' : 's'} × $49</div></div>`;
  ns.style.display = 'block';
  if (!ov.needs.length) {
    ns.className = 'allgood'; ns.id = 'needsStrip';
    ns.classList.add('allgood');
    ns.innerHTML = `<h3>Needs you — nothing 🎉</h3><div style="font-size:13.5px;color:#065f46;">No unsigned agreements, no stuck invoices, no failed checks. The machine is running itself.</div>`;
  } else {
    ns.classList.remove('allgood');
    ns.innerHTML = `<h3>Needs you — ${ov.needs.length} item${ov.needs.length === 1 ? '' : 's'}</h3>` +
      ov.needs.map(n => `<div class="need" ${n.id ? `onclick="openDrawer(${n.id})"` : ''}>${esc(n.msg)}</div>`).join('');
  }
}

const BOARD_COLS = ['New', 'Intake 1', 'Call', 'Closing', 'Paid', 'Building', 'Preview', 'Live', 'Ads'];
function colFor(c) {
  let b = {}; try { b = JSON.parse(c.billing || '{}'); } catch {}
  if (c.stage === 'ads_setup' || c.stage === 'ads_live') return 'Ads';
  if (c.stage === 'prospect') return 'New';
  if (c.stage === 'live') return 'Live';
  if (c.stage === 'preview_ready') return 'Preview';
  if (c.stage === 'generating') return 'Building';
  const depPaid = b.dep_status === 'paid' || b.invoice_status === 'paid';
  if (depPaid) return (c.stage === 'intake2_sent' || c.stage === 'intake2_done') ? 'Building' : 'Paid';
  if (b.invoice_status === 'open' || b.dep_status === 'open' || b.agr_sent) return 'Closing';
  if (c.stage === 'intake1_done' || c.stage === 'intake2_sent' || c.stage === 'intake2_done') return 'Call';
  if (c.stage === 'intake1_sent') return 'Intake 1';
  return 'New';
}
function meetChip(c) {
  let m = null; try { m = JSON.parse((STATE.settings || {})['meet_' + c.id] || 'null'); } catch (e) {}
  if (!m || !m.at) return '';
  const d = new Date(m.at);
  if (isNaN(d) || d.getTime() < Date.now() - 2 * 3600 * 1000) return '';
  const when = d.toLocaleString('en-US', { timeZone: 'America/Chicago', weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  return `<div style="font-size:12px;color:#0f766e;margin-top:3px;">📅 Call booked: ${when}${m.link ? ` · <a href="${m.link}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Meet link</a>` : ''}</div>`;
}
function renderBoard() {
  const el = document.getElementById('board');
  const active = STATE.clients.filter(c => c.stage !== 'archived');
  const byCol = {}; BOARD_COLS.forEach(k => byCol[k] = []);
  active.forEach(c => byCol[colFor(c)].push(c));
  el.innerHTML = BOARD_COLS.map(k => `
    <div class="bcol"><h4>${k} <span>${byCol[k].length}</span></h4>
      ${byCol[k].map(c => `<div class="bcard" onclick="openDrawer(${c.id})">
        <button class="peek" title="Open their portal — admin view" onclick="event.stopPropagation();openLink(${c.id}, 'portal', this)">👁</button>
        <b>${dot(c)}${esc(c.business_name || c.name || c.email)}</b>
        <span class="em">${esc(c.email)}</span>
        ${c.tier === 'premium' ? '<span class="tier">★ PREMIUM</span>' : ''}
        ${buildBar(c)}${meetChip(c)}
        <div style="font-size:11px;color:var(--muted);margin-top:3px;">${ago(c.updated_at)}</div>
      </div>`).join('') || '<div style="font-size:12px;color:#94a3b8;padding:6px;">—</div>'}
    </div>`).join('');
}

function renderClients() {
  const tb = document.getElementById('clientRows');
  if (!STATE.clients.length) { tb.innerHTML = '<tr><td colspan="4"><div class="empty">No clients yet — add one above to send your first automated Intake 1 email.</div></td></tr>'; return; }
  tb.innerHTML = STATE.clients.map(c => {
    const st = STAGES[c.stage] || STAGES.new;
    return `<tr class="rowclick" onclick="openDrawer(${c.id})">
      <td>${dot(c)}<b>${esc(c.name || c.email)}</b>${c.name ? `<br><span style="color:var(--muted);font-size:12px;margin-left:16px;">${esc(c.email)}</span>` : ''}</td>
      <td><span class="chip" style="background:${st.bg};color:${st.fg}">${st.label}</span>${editChip(c)}${buildBar(c)}${meetChip(c)}</td>
      <td style="color:var(--muted);font-size:13px">${ago(c.updated_at)}</td>
      <td><button class="peek" style="position:static" title="Open their portal — admin view" onclick="event.stopPropagation();openLink(${c.id}, 'portal', this)">👁</button> ${c.stage === 'intake1_done' ? `<button class="btn btn-green" onclick="event.stopPropagation();sendIntake2(${c.id}, this)">Approve → Intake 2</button>` : ''}</td>
    </tr>`;
  }).join('');
}

function renderFeed() {
  const f = document.getElementById('feed');
  if (!STATE.events.length) { f.innerHTML = '<div class="empty">Activity will appear here.</div>'; return; }
  const DETAIL_TYPES = ['error','site_edit','published','auto_published'];
  f.innerHTML = STATE.events.map(e => `<div class="item"><b>${esc(e.client_name || e.client_email || 'System')}</b> — ${esc(pretty(e.type))}${e.detail && DETAIL_TYPES.includes(e.type) ? `<br><span style="color:${e.type==='error'?'var(--red)':'#64748b'};font-size:12px">${esc(e.detail)}</span>`:''}<time>${ago(e.created_at)}</time></div>`).join('');
}

// EDIT VISIBILITY: amber badge data from /api/state (STATE.edits, keyed by slug)
function editFor(c) { return (STATE.edits || []).find(e => e.client_id === c.id); }
function editChip(c) {
  const e = editFor(c); if (!e) return '';
  return `<br><span class="chip" style="background:#fffbeb;color:#92400e;border:1px solid #fde68a;margin-top:4px;" title="${esc((e.files||[]).join(', '))}">📝 ${e.n} file${e.n===1?'':'s'} not yet published (${ago(e.since)})</span>`;
}
async function publishNow(slug, id, btn) {
  if (btn) { btn.disabled = true; btn.textContent = 'Publishing…'; }
  const r = await api('/api/sites/publish-now', { method:'POST', body: JSON.stringify({ slug, client_id: id }) });
  if (btn) { btn.disabled = false; btn.textContent = '🚀 Publish now'; }
  if (r.error) return toast('⚠ ' + r.error);
  if (r.complete) toast('✅ Published — ' + r.files + ' file(s) updated on ' + slug);
  else toast('📦 Publishing ' + slug + '… ' + r.remaining + ' file(s) to go — finishes automatically within ~5 min');
  await refresh();
  if (id) setTimeout(() => openDrawer(id), 300);
}
function pretty(t){ return ({client_created:'added to pipeline', booking_email_sent:'booking link emailed 📅', intake1_sent:'Intake 1 email sent', intake1_done:'submitted Intake 1 🎉', intake2_sent:'Intake 2 email sent', intake2_done:'submitted Intake 2 🎉', stage_changed:'stage updated', error:'⚠ error', client_deleted:'removed', webhook_received:'webhook ping', build_started:'⚙ build started', build_stalled:'⚠️ build stalled — re-queued', fire_requested:'🔥 manual builder fire requested', preview_ready:'★ preview is ready', preview_held:'⏸ preview HELD — awaiting your approval', preview_approved:'📤 preview approved & sent', preview_sent:'📤 reveal email sent to client', invoice_sent:'invoice sent 💳', invoice_paid:'payment received 💰', agreement_sent:'agreement sent 📄', agreement_signed:'agreement signed ✍️', portal_invited:'portal login sent 🔑', hosting_active:'hosting active 🔒', owner_digest:'weekly digest sent 📊', sms_sent:'text sent 📱', sms_skipped:'text skipped', prospect_created:'💡 prospect added', demo_ready:'💡 demo site ready', nudge_sent:'🤖 auto-nudge sent', build_stalled:'⚠️ build stalled — re-queued', site_rolled_back:'⏪ site restored to previous version', launched:'🚀 LAUNCHED', launch_emailed:'🚀 launch email sent', page1_celebrated:'🎉 Page 1 celebration sent', first_lead_celebrated:'🎉 first-lead celebration sent', report_notified:'📬 report-ready email sent', site_edit:'📝 site files edited', published:'✅ edits published', auto_published:'🚀 site republished', import_progress:'📦 importing site files'})[t] || t; }

async function sendExitPackage(id, btn) {
  if (!confirm('Send the exit package?\n\nThe client receives a warm goodbye email with a download link to their COMPLETE package: every website file, all reports, Google position history, and their signed agreement.\n\nNothing is deleted or archived — you stay in control of the card afterwards.')) return;
  btn.disabled = true;
  const r = await api(`/api/clients/${id}/exit-package`, { method: 'POST', body: '{}' });
  btn.disabled = false;
  if (r.error) return toast('⚠ ' + r.error);
  copyText(r.url || '');
  toast('📦 Exit package emailed — download link also copied for you');
}
async function rollbackSite(id, btn) {
  if (!confirm('Restore this website to its PREVIOUS version?\n\nSafe: this creates a new version (history is never deleted) and republishes within ~5 minutes. You can roll forward again later.')) return;
  btn.disabled = true;
  const r = await api(`/api/clients/${id}/rollback`, { method:'POST', body: '{}' });
  btn.disabled = false;
  if (r.error) return toast('⚠ ' + r.error);
  toast(`⏪ Restored to previous version (${r.restored}) — live again within ~5 min`);
  refresh(); setTimeout(() => openDrawer(id), 400);
}

async function addProspect() {
  const business_name = document.getElementById('proBiz').value.trim();
  const city = document.getElementById('proCity').value.trim();
  if (!business_name || !city) return toast('Enter the business name and city first');
  const btn = document.getElementById('proBtn'); btn.disabled = true;
  const r = await api('/api/prospects', { method:'POST', body: JSON.stringify({ business_name, city }) });
  btn.disabled = false;
  if (r.error) return toast('⚠ ' + r.error);
  document.getElementById('proBiz').value = ''; document.getElementById('proCity').value = '';
  toast('💡 Prospect added — demo builds on the next builder run (within 2h)');
  refresh();
}

async function convertProspect(id) {
  const email = (document.getElementById('convEmail')?.value || '').trim();
  if (!email || !/.+@.+\..+/.test(email)) return toast('Enter their real email first');
  await api(`/api/clients/${id}`, { method:'PATCH', body: JSON.stringify({ email, stage: 'new' }) });
  const r = await api('/api/clients', { method:'POST', body: JSON.stringify({ email }) });
  if (r.error) return toast('⚠ ' + r.error);
  toast('🎉 Prospect converted — Intake 1 sent to ' + email);
  closeDrawer(); refresh();
}

async function addClient() {
  const email = document.getElementById('newEmail').value.trim();
  const name = document.getElementById('newName').value.trim();
  if (!email) return toast('Enter an email first');
  const btn = document.getElementById('addBtn'); btn.disabled = true;
  const r = await api('/api/clients', { method:'POST', body: JSON.stringify({ email, name }) });
  btn.disabled = false;
  if (r.error) return toast('⚠ ' + r.error);
  document.getElementById('newEmail').value = ''; document.getElementById('newName').value = '';
  toast('Intake 1 sent to ' + email + ' ✓');
  refresh();
}

async function addAdsClient() {
  const email = document.getElementById('adsEmail').value.trim();
  const name = document.getElementById('adsName').value.trim();
  if (!email) return toast('Enter their email first');
  const btn = document.getElementById('adsBtn'); btn.disabled = true;
  try {
    const r = await api('/api/clients', { method: 'POST', body: JSON.stringify({ email, name }) });
    if (r.error) { toast('⚠ ' + r.error); btn.disabled = false; return; }
    const e = await api('/api/clients/' + r.id + '/ads-enroll', { method: 'POST', body: JSON.stringify({ mode: 'ads_only' }) });
    if (e.error) { toast('⚠ ' + e.error); btn.disabled = false; return; }
    document.getElementById('adsEmail').value = ''; document.getElementById('adsName').value = '';
    toast('Ads client started 📣 — Intake 1 sent, they are in the Ads lane');
    refresh();
  } catch (err) { toast('⚠ Could not start that one, try again'); }
  btn.disabled = false;
}

async function sendIntake2(id, btn) {
  if (btn) btn.disabled = true;
  const r = await api(`/api/clients/${id}/send-intake2`, { method:'POST' });
  if (btn) btn.disabled = false;
  if (r.error) return toast('⚠ ' + r.error);
  toast('Intake 2 sent ✓'); closeDrawer(); refresh();
}

function intakeBlock(title, json) {
  if (!json) return '';
  let data; try { data = JSON.parse(json); } catch { return ''; }
  const rows = Object.entries(data).map(([k,v]) => `<dt>${esc(k.replace(/_/g,' '))}</dt><dd>${esc(v)}</dd>`).join('');
  return `<div class="intake"><h4>${title}</h4><dl>${rows}</dl></div>`;
}

function openDrawer(id) {
  const c = STATE.clients.find(x => x.id === id); if (!c) return;
  const st = STAGES[c.stage] || STAGES.new;
  document.getElementById('drawer').innerHTML = `
    <div class="dhead"><h2>${esc(c.name || c.email)}</h2><p>${esc(c.email)}${c.phone ? ' · ' + esc(c.phone) : ''}</p></div>
    <div class="dbody">
      <div><span class="chip" style="background:${st.bg};color:${st.fg}">${st.label}</span> <span id="seoScore" style="font-size:12.5px;color:#64748b;"></span>${buildBar(c)}</div>
      <div class="actions">

async function uploadPhotos(id, input) {
  const files = [...input.files].slice(0, 6);
  if (!files.length) return;
  toast(`Uploading ${files.length} photo(s)…`);
  let slot = 1;
  // find next free slots by probing existing previews
  for (const f of files) {
    if (f.size > 3_000_000) { toast('⚠ One photo skipped — over 3MB'); continue; }
    const ext = f.type.includes('webp') ? 'webp' : f.type.includes('png') ? 'png' : 'jpg';
    const b64 = await new Promise((res) => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(f); });
    while (slot <= 6) {
      const probe = await fetch(`/api/clients/${id}/photo/${slot}`, { method: 'HEAD' });
      if (!probe.ok) break; slot++;
    }
    if (slot > 6) { toast('⚠ All 6 photo slots full'); break; }
    const r = await api(`/api/clients/${id}/photo`, { method:'POST', body: JSON.stringify({ b64, ext, n: slot }) });
    if (r.error) { toast('⚠ ' + r.error); break; }
    slot++;
  }
  toast('Photos saved 📷');
  refresh(); setTimeout(() => openDrawer(id), 400);
}

<script>
// 🛰 OPS STATUS STRIP (8/18/2026) — live clock + system status under the header.
(function () {
  var strip = document.createElement('div');
  strip.id = 'mcStrip';
  document.querySelector('header').insertAdjacentElement('afterend', strip);
  function fmt(d, tz) {
    return d.toLocaleTimeString('en-US', { timeZone: tz, hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }
  function render() {
    var cs = (typeof STATE !== 'undefined' && STATE && STATE.clients) || [];
    var evs = (typeof STATE !== 'undefined' && STATE && STATE.events) || [];
    var dayAgo = Date.now() - 86400000;
    var errs = 0;
    for (var i = 0; i < evs.length; i++) {
      if (evs[i].type === 'error') {
        var t = Date.parse((evs[i].created_at || '').replace(' ', 'T') + 'Z');
        if (t > dayAgo) errs++;
      }
    }
    var live = cs.filter(function (c) { return c.stage === 'live'; }).length;
    var building = cs.filter(function (c) { return ['generating', 'intake2_done'].indexOf(c.stage) >= 0; }).length;
    var review = cs.filter(function (c) { return c.stage === 'preview_ready'; }).length;
    var now = new Date();
    strip.innerHTML =
      '<span>' + (errs ? '<span class="dot warn"></span><span class="warn">' + errs + ' ALERT' + (errs > 1 ? 'S' : '') + ' (24H)</span>' : '<span class="dot"></span><span class="ok">ALL SYSTEMS NOMINAL</span>') + '</span>' +
      '<span><span class="lbl">Clients</span><b>' + cs.length + '</b></span>' +
      '<span><span class="lbl">Live</span><b>' + live + '</b></span>' +
      (building ? '<span><span class="lbl">Building</span><b>' + building + '</b></span>' : '') +
      (review ? '<span><span class="lbl">For review</span><b>' + review + '</b></span>' : '') +
      '<span class="spacer"></span>' +
      '<span><span class="lbl">Local</span><b>' + fmt(now, 'America/Chicago') + '</b></span>' +
      '<span><span class="lbl">UTC</span><b>' + fmt(now, 'UTC') + '</b></span>';
  }
  render();
  setInterval(render, 1000);
})();
</script>

    } catch (e) { toast('⚠ Could not save, try again'); }
  };
  window.adsIdsPrompt = async function (id) {
    var rep = repFor(id) || {};
    var ga4 = prompt('Google Analytics 4 measurement ID for this client (G-XXXXXXX).\n\nLeave blank to clear. Cancel to stop.', rep.ga4_measurement || '');
    if (ga4 === null) return;
    var gtm = prompt('Google Tag Manager container ID (GTM-XXXXXXX).\n\nOptional — leave blank unless this client uses GTM.', rep.gtm_id || '');
    if (gtm === null) return;
    var clarity = prompt('Microsoft Clarity project ID.\n\nLeave blank to skip.', rep.clarity_id || '');
    if (clarity === null) return;
    var aw = prompt('Google Ads conversion ID (AW-XXXXXXXXX).\n\nOptional — only if you tag Ads conversions directly instead of importing them from GA4.', rep.aw_id || '');
    if (aw === null) return;
    try {
      var r = await api('/api/clients/' + id + '/ads-ids', { method: 'POST', body: JSON.stringify({ ga4: ga4, gtm: gtm, clarity: clarity, aw: aw }) });
      if (r && r.error) { toast('⚠ ' + r.error); return; }
      var rp = repFor(id) || {};
      rp.ga4_measurement = r.ga4; rp.gtm_id = r.gtm; rp.clarity_id = r.clarity; rp.aw_id = r.aw;
      STATE.settings['ads_' + id] = JSON.stringify(rp);
      toast('Tracking IDs saved 🏷 — live on their page within 5 minutes, no re-paste needed');
      renderAdsView();
    } catch (e) { toast('⚠ Could not save, try again'); }
  };
  window.adsTabConnect = async function (id, btn) {
    var inp = document.getElementById('adsTabUrl' + id);
    var url = inp ? inp.value.trim() : '';
    if (!url) { toast('Paste the landing page URL first'); return; }
    btn.disabled = true; btn.textContent = 'Checking…';
    try {
      var r = await api('/api/clients/' + id + '/ads-connect', { method: 'POST', body: JSON.stringify({ url: url }) });
      if (r && r.error) toast('⚠ ' + r.error);
      else { STATE.settings['ads_' + id] = JSON.stringify(r); toast(r.ok ? 'Tracking is green ✅' : 'Checked — some lights are red'); renderAdsView(); }
    } catch (e) { toast('⚠ Connect failed, try again'); }
    btn.disabled = false; btn.textContent = 'Connect';
  };
  var _rf = window.refresh;
  if (typeof _rf === 'function') {
    window.refresh = async function () { var r = await _rf.apply(this, arguments); if (VIEW === 'ads') { try { renderAdsView(); } catch (e) {} } return r; };
  }
})();
</script>

<!-- ═══ ADS PROVISION v1 (8/19/2026) — one paste does the whole setup ═══ -->
<style>

</style>
<script>
(function () {
  function repOf(id) { try { return JSON.parse((STATE.settings || {})['ads_' + id] || '{}'); } catch (e) { return {}; } }
  function modal(title, html) {
    var m = document.getElementById('ccMod');
    if (!m) {
      m = document.createElement('div'); m.id = 'ccMod';
      m.innerHTML = '<div id="ccModBox"><div id="ccModHead"><h3></h3><span class="x">&times;</span></div><div id="ccModBody"></div></div>';
      document.body.appendChild(m);
      m.addEventListener('click', function (e) { if (e.target === m || e.target.className === 'x') m.classList.remove('on'); });
    }
    m.querySelector('#ccModHead h3').textContent = title;
    m.querySelector('#ccModBody').innerHTML = html;
    m.classList.add('on');
    return m;
  }
  window.ccModal = modal;

  function stepsHtml(steps) {
    return (steps || []).map(function (s) {
      var col = s.done ? '#0F9D58' : '#C7A86B';
      return '<div class="ccStep"><div class="d" style="background:' + col + '">' + (s.done ? '&#10003;' : '&#8226;') + '</div>' +
        '<div><div class="lb">' + esc(s.label) + '</div><div class="dt">' + esc(s.detail || '') + '</div></div></div>';
    }).join('');
  }

  function linksHtml(links, id) {
    var b = [];
    if (links.newCampaign) b.push('<a class="btn btn-primary" style="text-decoration:none;font-size:12.5px" href="' + esc(links.newCampaign) + '" target="_blank" rel="noopener">&#128226; Build the campaign in Google Ads &#8599;</a>');
    else b.push('<a class="btn btn-primary" style="text-decoration:none;font-size:12.5px" href="' + esc(links.createAccount) + '" target="_blank" rel="noopener">&#10133; Create their Google Ads account &#8599;</a>');
    if (!links.cid) b.push('<button class="btn btn-ghost" style="font-size:12.5px" onclick="adsAccountPrompt(' + id + ')">Paste their 10-digit ID</button>');
    if (links.linkGa4) b.push('<a class="btn btn-ghost" style="text-decoration:none;font-size:12.5px" href="' + esc(links.linkGa4) + '" target="_blank" rel="noopener">Link GA4 in Ads &#8599;</a>');
    if (links.conversions) b.push('<a class="btn btn-ghost" style="text-decoration:none;font-size:12.5px" href="' + esc(links.conversions) + '" target="_blank" rel="noopener">Import conversions &#8599;</a>');
    b.push('<a class="btn btn-ghost" style="text-decoration:none;font-size:12.5px" href="' + esc(links.ga4) + '" target="_blank" rel="noopener">Google Analytics &#8599;</a>');
    return '<div class="ccGo">' + b.join('') + '</div>';
  }

  function sheetHtml(brief) {
    if (!brief || !brief.text) return '';
    return '<div style="display:flex;align-items:center;gap:10px;margin-top:20px">' +
      '<div style="font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--faint,#8A94A6)">Campaign build sheet</div>' +
      '<button class="btn btn-ghost" style="font-size:11.5px;padding:5px 10px" onclick="ccCopySheet(this)">&#128203; Copy all</button></div>' +
      '<div id="ccSheet">' + esc(brief.text) + '</div>';
  }

  window.ccCopySheet = function (btn) {
    var el = document.getElementById('ccSheet'); if (!el) return;
    var t = el.textContent;
    if (navigator.clipboard) navigator.clipboard.writeText(t);
    else { var ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
    btn.textContent = 'Copied ✓'; setTimeout(function () { btn.innerHTML = '&#128203; Copy all'; }, 1800);
  };

  window.adsProvision = async function (id, btn) {
    var inp = document.getElementById('adsTabUrl' + id);
    var url = inp ? inp.value.trim() : (repOf(id).url || '');
    if (!url) { toast('Paste their GoHighLevel landing page URL first'); return; }
    var label = btn ? btn.innerHTML : '';
    if (btn) { btn.disabled = true; btn.textContent = 'Setting up…'; }
    try {
      var r = await api('/api/clients/' + id + '/ads-provision', { method: 'POST', body: JSON.stringify({ url: url }) });
      if (r && r.error) { toast('⚠ ' + r.error); }
      else {
        STATE.settings['ads_' + id] = JSON.stringify(r.report);
        var warn = '';
        if (r.report && r.report.checks && r.report.checks.tracker && !r.report.checks.tracker.ok) {
          warn = '<div style="background:#FFFAEB;border:1px solid #FEC84B;border-radius:10px;padding:12px 14px;font-size:12.5px;margin-bottom:14px">' +
            'The tracking snippet is not on the page yet. Copy it with <b>Tracking code</b>, paste it into the GoHighLevel funnel&rsquo;s <b>head tracking code</b>, save, then hit <b>Re-check</b>. Everything else below is already done.</div>';
        }
        if (r.ga4 && r.ga4.pending) {
          warn += '<div style="background:#EFF4FF;border:1px solid #B2CCFF;border-radius:10px;padding:12px 14px;font-size:12.5px;margin-bottom:14px">' +
            'Google Analytics could not be created automatically (' + esc(r.ga4.pending) + '). Create the property by hand and paste the G- ID with <b>Tracking IDs</b> — the snippet picks it up within 5 minutes with no re-paste.</div>';
        }
        var m = modal('Ads setup — ' + (url.replace(/^https?:\/\//, '').slice(0, 44)),
          warn + stepsHtml(r.steps) + linksHtml(r.links || {}, id) +
          '<p style="font-size:11.5px;color:var(--faint,#8A94A6);margin:10px 0 0">Mission Control never creates or enables an ad. It sets up the measurement, writes the sheet, and opens the door — you build the campaign and turn it on.</p>' +
          '<div id="ccHead" style="margin-top:22px;padding-top:18px;border-top:2px solid var(--line,#E6E9EF)">' +
          '<div style="font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--navy,#0B1D33);margin-bottom:2px">Head code for GoHighLevel</div>' +
          '<div style="font-size:12px;color:var(--faint,#8A94A6)">loading the exact tags for this client…</div></div>' +
          sheetHtml(r.brief));
        // the exact tags, filled in with THIS client's real IDs — right here, the
        // moment the page is connected, so she never has to go hunting for them
        try {
          var hc = await api('/api/clients/' + id + '/head-code');
          var box = document.getElementById('ccHead');
          if (box && hc && !hc.error) {
            box.innerHTML = '<div style="font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--navy,#0B1D33)">Head code for GoHighLevel</div>' + headCodeHtml(hc, id);
          }
        } catch (e) {}
        toast('Setup done ⚡');
        try { renderAdsView(); } catch (e) {}
      }
    } catch (e) { toast('⚠ Setup failed, try again'); }
    if (btn) { btn.disabled = false; btn.innerHTML = label || '&#9889; Set it all up'; }
  };

  window.adsSheet = async function (id) {
    try {
      var r = await api('/api/clients/' + id + '/ads-brief');
      if (r && r.error) { toast('⚠ ' + r.error); return; }
      modal('Campaign build sheet', linksHtml(r.links || {}, id) + sheetHtml(r.brief));
    } catch (e) { toast('⚠ Could not load the sheet'); }
  };

  // ══ HEAD CODE FOR GOHIGHLEVEL ═══════════════════════════════════════════
  var CODEN = 0;
  function codeBlock(title, code, note) {
    if (!code) return '';
    var cid = 'cc_code_' + (++CODEN);
    return '<div style="margin-top:14px">' +
      '<div style="display:flex;align-items:center;gap:10px">' +
      '<div style="font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--navy,#0B1D33)">' + esc(title) + '</div>' +
      '<button class="btn btn-ghost" style="font-size:11px;padding:4px 9px" onclick="ccCopyEl(this,\'' + cid + '\')">&#128203; Copy</button></div>' +
      (note ? '<div style="font-size:11.5px;color:var(--faint,#8A94A6);margin-top:3px">' + note + '</div>' : '') +
      '<pre id="' + cid + '" style="background:#0B1D33;color:#D8E2EF;font-family:var(--font-mono,ui-monospace,monospace);font-size:11px;line-height:1.5;padding:12px 14px;border-radius:10px;margin-top:6px;overflow:auto;white-space:pre-wrap;word-break:break-word">' + esc(code) + '</pre></div>';
  }
  window.ccCopyEl = function (btn, elId) {
    var el = document.getElementById(elId); if (!el) return;
    var t = el.textContent;
    if (navigator.clipboard) navigator.clipboard.writeText(t);
    else { var ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
    btn.textContent = 'Copied ✓'; setTimeout(function () { btn.innerHTML = '&#128203; Copy'; }, 1600);
  };

  function headCodeHtml(d, id) {
    var h = '';
    if (d.trackerOnPage) {
      h += '<div style="background:#ECFDF3;border:1px solid #6CE9A6;border-radius:10px;padding:11px 14px;font-size:12.5px;margin-bottom:6px">' +
        '&#10003; The tag is already on this page &mdash; nothing to paste unless you are switching methods.</div>';
    }
    h += '<div style="font-size:12.5px;color:var(--navy,#0B1D33);margin:4px 0 2px"><b>Where this goes in GoHighLevel</b></div>' +
      '<ol style="font-size:12.5px;color:var(--muted,#5D6B7E);margin:4px 0 2px;padding-left:20px;line-height:1.65">' +
      (d.where || []).map(function (w) { return '<li>' + esc(w) + '</li>'; }).join('') + '</ol>';

    h += '<div style="margin-top:16px;padding:12px 14px;border:1.5px solid var(--gold,#C7A86B);border-radius:12px">' +
      '<div style="font-size:13px;font-weight:700;color:var(--navy,#0B1D33)">Option A &mdash; one tag, does everything <span style="font-weight:500;color:var(--faint,#8A94A6)">(recommended)</span></div>' +
      '<div style="font-size:12px;color:var(--muted,#5D6B7E);margin-top:3px">Loads Google Analytics' + (d.clarity ? ' and Clarity' : '') +
      ', and binds call, text, form and booking events &mdash; including inside GoHighLevel&rsquo;s form and calendar iframes, which a plain tag cannot see. Change an ID here later and every page updates within five minutes with no re-paste.</div>' +
      codeBlock('Paste into Head Tracking Code', d.one) + '</div>';

    h += '<div style="margin-top:16px;padding:12px 14px;border:1px solid var(--line,#E6E9EF);border-radius:12px">' +
      '<div style="font-size:13px;font-weight:700;color:var(--navy,#0B1D33)">Option B &mdash; Google&rsquo;s and Microsoft&rsquo;s own tags</div>' +
      '<div style="font-size:12px;color:var(--muted,#5D6B7E);margin-top:3px">Use this if you want the native tags on the page. Paste all three blocks &mdash; the third one binds the key events without loading anything twice.</div>';
    h += d.ga4Tag ? codeBlock('1 · Google Analytics (' + d.ga4 + ')', d.ga4Tag) :
      '<div style="margin-top:12px;font-size:12.5px;color:#B54708;background:#FFFAEB;border:1px solid #FEC84B;border-radius:10px;padding:10px 12px">No Google Analytics ID yet &mdash; press <b>&#9889; Set it all up</b> and Mission Control creates the property.</div>';
    h += d.clarityTag ? codeBlock('2 · Microsoft Clarity (' + d.clarity + ')', d.clarityTag) :
      '<div style="margin-top:12px;font-size:12.5px;background:#EFF4FF;border:1px solid #B2CCFF;border-radius:10px;padding:10px 12px">' +
      '<b>Clarity needs one sign-in from you.</b><br>clarity.microsoft.com &rarr; New project &rarr; name it &ldquo;' + esc(d.biz || '') + '&rdquo;, site type Website, paste the landing page URL. The project ID is in Settings &rarr; Overview.' +
      '<div style="margin-top:8px"><button class="btn btn-primary" style="font-size:11.5px;padding:6px 11px" onclick="clarityPrompt(' + id + ')">Paste the Clarity ID</button>' +
      ' <a class="btn btn-ghost" style="font-size:11.5px;padding:6px 11px;text-decoration:none" href="https://clarity.microsoft.com/projects" target="_blank" rel="noopener">Open Clarity &#8599;</a></div></div>';
    h += codeBlock('3 · ConversionCo key events', d.eventsTag, 'Required with Option B &mdash; this is what counts calls, texts, forms and bookings.');
    h += '</div>';

    h += '<div style="margin-top:14px;background:#FEF3F2;border:1px solid #FDA29B;border-radius:10px;padding:10px 13px;font-size:12.5px;color:#B42318">' +
      '<b>Pick one option, not both.</b> Pasting Option A and Option B together loads Google Analytics twice and every visit gets counted twice.</div>';
    if (d.gtmTag) h += codeBlock('Google Tag Manager (' + d.gtm + ')', d.gtmTag, 'Only if this client uses their own GTM container.');
    return h;
  }

  window.adsHeadCode = async function (id) {
    try {
      var d = await api('/api/clients/' + id + '/head-code');
      if (d && d.error) { toast('⚠ ' + d.error); return; }
      modal('Head code for GoHighLevel — ' + (d.biz || ''), headCodeHtml(d, id));
    } catch (e) { toast('⚠ Could not build the head code'); }
  };

  // ══ ADS ECONOMICS — back-solve the budget from the client's own numbers ══
  window.adsEcon = async function (id) {
    var rep = {}; try { rep = JSON.parse((STATE.settings || {})['ads_' + id] || '{}'); } catch (e) {}
    var e = rep.econ || {};
    var f = function (lbl, key, val, hint, suffix) {
      return '<label style="display:block;margin-top:12px">' +
        '<div style="font-size:12.5px;font-weight:600;color:var(--navy,#0B1D33)">' + lbl + '</div>' +
        '<div style="font-size:11.5px;color:var(--faint,#8A94A6);margin-bottom:4px">' + hint + '</div>' +
        '<input id="ec_' + key + '" type="number" step="any" value="' + (val === undefined || val === null || val === 0 ? '' : val) + '" ' +
        'style="width:160px;font-size:13px;padding:7px 10px;border:1px solid var(--line,#E6E9EF);border-radius:8px;background:#FBFCFE">' +
        (suffix ? '<span style="font-size:12px;color:var(--faint,#8A94A6);margin-left:8px">' + suffix + '</span>' : '') +
        '</label>';
    };
    var body = '<p style="font-size:12.5px;color:var(--muted,#5D6B7E);margin:0 0 4px">These six numbers back-solve the budget, the most you can pay per lead, and whether the math works at all. They are internal planning figures — they never appear in anything a client sees, and they are not a promise.</p>' +
      f('Average value of a new client', 'ticket', e.ticket, 'What one new client is worth in revenue, first visit plus what they typically come back for.', 'dollars') +
      f('Gross margin', 'margin', e.margin ? Math.round(e.margin * 100) : 60, 'What is left after the cost of delivering it. 60 is a reasonable default.', '%') +
      f('Lead to client close rate', 'close_rate', e.close_rate ? Math.round(e.close_rate * 100) : 25, 'Of the people who enquire, how many actually book and pay.', '%') +
      f('Target new clients per month', 'target_clients', e.target_clients, 'What the client is hoping for. Be honest here rather than optimistic.', 'clients') +
      f('Expected cost per click', 'cpc', e.cpc, 'Use the HIGH end of the Keyword Planner range for their city, not the average.', 'dollars') +
      f('Landing page conversion rate', 'lp_cvr', e.lp_cvr ? Math.round(e.lp_cvr * 100) : 8, 'Of the people who land on the page, how many enquire. 8 is a fair starting assumption.', '%') +
      '<div style="margin-top:18px"><button class="btn btn-primary" style="font-size:12.5px" onclick="adsEconSave(' + id + ', this)">Save and rebuild the sheet</button></div>' +
      '<div id="ecOut" style="margin-top:16px"></div>';
    modal('Ads economics — what the numbers have to be', body);
    if (rep.econ && rep.econ.target_clients) adsEconRender(rep.econ, null, id);
  };

  function adsEconRender(econ, model, id) {
    var out = document.getElementById('ecOut'); if (!out) return;
    if (!model) { out.innerHTML = '<div style="font-size:12px;color:var(--faint,#8A94A6)">Saved values loaded. Press save to recalculate.</div>'; return; }
    var row = function (k, v, warn) {
      return '<div style="display:flex;justify-content:space-between;gap:14px;padding:7px 0;border-bottom:1px solid var(--line,#E6E9EF)">' +
        '<span style="font-size:13px;color:var(--muted,#5D6B7E)">' + k + '</span>' +
        '<span style="font-size:13.5px;font-weight:600;color:' + (warn ? '#B42318' : 'var(--navy,#0B1D33)') + '">' + v + '</span></div>';
    };
    var h = '<div style="border:1px solid var(--line,#E6E9EF);border-radius:12px;padding:14px 16px">';
    if (model.gross_per_client) h += row('Gross profit per new client', '$' + model.gross_per_client);
    if (model.leads_needed) h += row('Leads needed per month', model.leads_needed);
    if (model.max_cpl) h += row('Most you can pay per lead', '$' + model.max_cpl);
    if (model.projected_cpl) h += row('Projected cost per lead', '$' + model.projected_cpl, model.headroom < 0);
    if (model.monthly_budget) h += row('Budget the math implies', '$' + model.monthly_budget + '/mo  (~$' + model.daily_budget + '/day)');
    if (model.floor_daily) h += row('Floor to learn anything', '$' + model.floor_daily + '/day');
    if (model.headroom !== undefined && model.headroom !== null) {
      h += row('Headroom per lead', (model.headroom >= 0 ? '$' + model.headroom : '-$' + Math.abs(model.headroom)), model.headroom < 0);
    }
    h += '</div>';
    if (model.headroom < 0) {
      h += '<div style="margin-top:12px;background:#FEF3F2;border:1px solid #FDA29B;border-radius:10px;padding:11px 14px;font-size:12.5px;color:#B42318">' +
        '<b>The math does not work at these numbers.</b> A lead would cost more than it earns. Spending more does not fix it — it just loses faster.</div>';
      if (model.required) {
        h += '<div style="margin-top:12px;border:1.5px solid var(--gold,#C7A86B);border-radius:12px;padding:12px 14px">' +
          '<div style="font-size:12.5px;font-weight:700;color:var(--navy,#0B1D33);margin-bottom:6px">What would have to be true — any one of these closes the gap</div>' +
          '<ul style="margin:0;padding-left:18px;font-size:12.5px;color:var(--muted,#5D6B7E);line-height:1.7">' +
          '<li>A new client is worth <b>$' + model.required.ticket + '</b> instead of $' + model.ticket +
            ' <span style="color:var(--faint,#8A94A6)">(count memberships, packages and repeat visits, not one visit)</span></li>' +
          '<li>The landing page converts at <b>' + model.required.lp_cvr + '%</b> instead of ' + Math.round(model.lp_cvr * 100) + '%</li>' +
          '<li>Cost per click comes in at <b>$' + model.required.cpc + '</b> instead of $' + model.cpc +
            ' <span style="color:var(--faint,#8A94A6)">(tighter, higher-intent keywords)</span></li>' +
          '</ul></div>';
      }
    } else if (model.required) {
      h += '<div style="margin-top:12px;background:#ECFDF3;border:1px solid #6CE9A6;border-radius:10px;padding:11px 14px;font-size:12.5px;color:#067647">' +
        'The math works. It stops working if a client drops below <b>$' + model.required.ticket + '</b> in value, the page falls under <b>' +
        model.required.lp_cvr + '%</b>, or the cost per click passes <b>$' + model.required.cpc + '</b>.</div>';
    }
    if (model.smart_bidding_ok === false) {
      h += '<div style="margin-top:12px;background:#FFFAEB;border:1px solid #FEC84B;border-radius:10px;padding:11px 14px;font-size:12.5px;color:#B54708">' +
        'Under 15 leads a month, Google\'s bidding cannot learn. Either raise the budget or optimise to a softer conversion first.</div>';
    }
    h += '<p style="font-size:11.5px;color:var(--faint,#8A94A6);margin-top:12px">Planning model, not a forecast and not a promise. Ad results are never guaranteeable — this tells you what would have to be true, and the silent-failure check tells you when reality drifts from it.</p>';
    out.innerHTML = h;
  }

  window.adsEconSave = async function (id, btn) {
    var g = function (k) { var el = document.getElementById('ec_' + k); return el ? el.value : ''; };
    btn.disabled = true; btn.textContent = 'Saving…';
    try {
      var r = await api('/api/clients/' + id + '/ads-economics', { method: 'POST', body: JSON.stringify({
        ticket: g('ticket'), margin: g('margin'), close_rate: g('close_rate'),
        target_clients: g('target_clients'), cpc: g('cpc'), lp_cvr: g('lp_cvr') }) });
      if (r && r.error) { toast('⚠ ' + r.error); }
      else {
        var rp = {}; try { rp = JSON.parse((STATE.settings || {})['ads_' + id] || '{}'); } catch (e) {}
        rp.econ = r.econ; rp.brief = r.brief; STATE.settings['ads_' + id] = JSON.stringify(rp);
        adsEconRender(r.econ, r.model, id);
        toast('Numbers saved — the build sheet rebuilt around them');
        try { renderAdsView(); } catch (e) {}
      }
    } catch (e) { toast('⚠ Could not save, try again'); }
    btn.disabled = false; btn.textContent = 'Save and rebuild the sheet';
  };

  // ══ the four Google powers, at a glance ═════════════════════════════════
  var _gh = null;
  window.googleHealth = async function () {
    var box = document.getElementById('gHealth'); if (!box) return;
    try {
      if (!_gh) _gh = await api('/api/google-health');
      var d = _gh;
      var LABEL = { search_console: 'Search Console', calendar: 'Calendar', analytics_admin: 'Analytics setup', analytics_summaries: 'Analytics data' };
      var dot = function (state) {
        var col = state === 'ok' ? '#0F9D58' : '#B42318';
        return '<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:' + col + ';margin-right:6px"></span>';
      };
      var h = '<div style="font-family:var(--font-mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint)">Google connection</div>';
      Object.keys(LABEL).forEach(function (k) {
        h += '<div>' + dot(d[k]) + '<span style="color:var(--navy,#0B1D33)">' + LABEL[k] + '</span></div>';
      });
      h += '<div>' + (d.ga4_ready ? '<span style="color:#0F9D58">✓</span> can create new Analytics properties' : '<span style="color:#B42318">✗</span> no Analytics account to build on') + '</div>';
      if (!d.token) h = '<div style="color:#B42318"><b>Google is disconnected.</b> The refresh token is not working — nothing that needs Google will run until it is replaced.</div>';
      box.innerHTML = h;
    } catch (e) { box.textContent = ''; }
  };
  var _rav = window.renderAdsView;
  if (typeof _rav === 'function') {
    window.renderAdsView = function () { var r = _rav.apply(this, arguments); try { googleHealth(); } catch (e) {} return r; };
  }

  window.adsBilling = async function (id, btn) {
    var rep = {}; try { rep = JSON.parse((STATE.settings || {})['ads_' + id] || '{}'); } catch (e) {}
    if (rep.sub_status === 'active') { toast('Ads billing is already live for this client — $249/mo'); return; }
    if (rep.sub_link) {
      if (navigator.clipboard) navigator.clipboard.writeText(rep.sub_link);
      toast('Billing link copied 💳 — send it to the client, they enter their own card');
      return;
    }
    var label = btn ? btn.innerHTML : '';
    btn.disabled = true; btn.textContent = 'Creating…';
    try {
      var r = await api('/api/clients/' + id + '/ads-subscription', { method: 'POST', body: '{}' });
      if (r && r.error) { toast('⚠ ' + r.error); }
      else {
        rep.sub_link = r.url; rep.sub_status = 'pending';
        STATE.settings['ads_' + id] = JSON.stringify(rep);
        if (navigator.clipboard) navigator.clipboard.writeText(r.url);
        toast('$249/mo billing link created and copied 💳 — send it to the client');
        try { renderAdsView(); } catch (e) {}
      }
    } catch (e) { toast('⚠ Could not create the billing link'); }
    btn.disabled = false; btn.innerHTML = label || '&#128179; $249/mo billing';
  };

  window.clarityPrompt = async function (id) {
    var cur = '';
    try { cur = (JSON.parse((STATE.settings || {})['ads_' + id] || '{}')).clarity_id || ''; } catch (e) {}
    var v = prompt('Microsoft Clarity project ID for this client.\n\nFind it at clarity.microsoft.com → your project → Settings → Overview.\nIt looks like: abcd1234ef', cur);
    if (v === null) return;
    try {
      var r = await api('/api/clients/' + id + '/ads-ids', { method: 'POST', body: JSON.stringify({ clarity: v.trim() }) });
      if (r && r.error) { toast('⚠ ' + r.error); return; }
      var rp = {}; try { rp = JSON.parse((STATE.settings || {})['ads_' + id] || '{}'); } catch (e) {}
      rp.clarity_id = r.clarity; STATE.settings['ads_' + id] = JSON.stringify(rp);
      toast(v.trim() ? 'Clarity ID saved — the tag is filled in' : 'Clarity ID cleared');
      window.adsHeadCode(id);
    } catch (e) { toast('⚠ Could not save, try again'); }
  };
})();
</script>
</body>
</html>
